name: CI

# 태그를 밀기 전에 깨진 걸 알기 위한 검사. release.yml 도 같은 명령을 다시 돌린다
# (릴리스는 테스트를 통과해야만 만들어진다).
on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build & test
        run: |
          npm ci
          npm run build
          # test = 테스트 타입체크 + 공유 파일(check-shared) + 전체 테스트
          npm test
          # 골든은 동작의 기준선이다 — 테스트가 다시 쓴 흔적이 남으면 안 된다
          git diff --exit-code tests/golden
          test -z "$(git status --porcelain tests/golden)"
